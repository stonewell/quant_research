[project]
name = "web-livetrading"
version = "0.1.0"
description = "Production-grade Live Trading Deployment Web Application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "httpx>=0.27.0",
]

[tool.uv]
environments = [
]
