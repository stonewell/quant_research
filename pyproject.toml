[project]
name = "quant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.uv]
environments = [
    "sys_platform == 'win32'",
]
